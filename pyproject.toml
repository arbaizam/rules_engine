[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rules-engine"
version = "0.2.0"
description = "Strict YAML rules engine metadata package for Databricks."
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["rules_engine*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "C90", "DTZ", "FURB"]

[tool.ruff.lint.mccabe]
max-complexity = 20
