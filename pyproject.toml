[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rules-engine"
dynamic = ["version"]
description = "Strict YAML rules engine metadata package for Databricks."
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "build==1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rules_engine*"]

[tool.setuptools.dynamic]
version = {attr = "rules_engine.version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "C90", "DTZ", "FURB"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["B018", "F821"]
