ruleset_id: gl_acct_id_long_ruleset
ruleset_name: GL Account ID Long Mapping
version: "1"
status: published
owner: Rules Team
owner_department: ALM Engineering
description: Canonical YAML translation of GL_ACCT_ID_LONG PySpark when/otherwise mapping.
rules:
  - rule_id: gl_acct_id_long_001
    rule_name: Cash Due from Banks CoreFirst
    rule_order: 1
    stop_on_match: true
    when: {all: [{left: {field: AccountID}, operator: eq, right: {literal: "10000"}, null_input_mode: propagate, null_result_mode: "null"}, {left: {field: BankAccountID}, operator: starts_with, right: {literal: "CoreFirst_"}, null_input_mode: propagate, null_result_mode: "null"}]}
    assign: {GL_ACCT_ID_LONG: "SC1000.CashAndDueFromBanks-CoreFirst"}
