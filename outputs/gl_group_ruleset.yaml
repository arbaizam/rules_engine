ruleset_id: gl_group_ruleset
ruleset_name: GL Group Mapping
version: '1'
owner: Rules Team
owner_department: ALM Engineering
description: Canonical YAML translation of GL grouping rules with structured derivation trace assignments.
rules:
- rule_id: gl_group_id_001
  rule_name: Cash Due from Banks CoreFirst
  rule_order: 1
  stop_on_match: true
  when:
    all:
    - condition_id: gl_group_id_001_c1
      left:
        field: AccountID
      operator: eq
      right:
        literal: '10000'
    - condition_id: gl_group_id_001_c2
      left:
        field: BankAccountID
      operator: starts_with
      right:
        literal: CoreFirst_
  assign:
    gl_group_id: CashAndDueFromBanks-CoreFirst
    gl_crs_code: SC1000
    gl_group_conditions:
      literal:
        AccountID:
        - '10000'
        ProductID: null
        BookCode: null
        BankAccountID:
        - starts_with:CoreFirst_
